name: ShellCheck

on:
  pull_request:
  push:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint every tracked shell script
        run: shellcheck --severity=warning $(git ls-files '*.sh')
