name: Engineering tests

on:
  pull_request:
  push:

jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared Python test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run deterministic engineering suite
        run: make test
